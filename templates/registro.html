<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #f1f3f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 2.5rem 2.25rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
        }

        .title {
            color: #1e293b;
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 0.4rem;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .alert-container {
            margin-bottom: 1.25rem;
        }

        .alert {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-align: center;
            font-weight: 500;
        }

        .alert-danger {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
        }

        .alert-success {
            background-color: #dcfce7;
            border: 1px solid #86efac;
            color: #15803d;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.45rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: #1e293b;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid #8fa2b8;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #334155;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #ffffff;
        }

        .form-control::placeholder {
            color: #7d90a6;
            font-size: 0.9rem;
        }

        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .input-container.with-icon .form-control {
            padding-right: 2.8rem;
        }

        .toggle-password {
            position: absolute;
            right: 0.8rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
        }

        .toggle-password svg {
            width: 22px;
            height: 22px;
        }

        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 0.95rem;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
            margin-bottom: 1.75rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .footer-text {
            text-align: center;
            color: #334155;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .login-link {
            display: block;
            text-align: center;
            color: #3b66cf;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .login-link:hover {
            color: #254db1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">Crear Cuenta</h1>
        <p class="subtitle">Ingresa tus datos para registrarte</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="alert-container">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('registro') }}" method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        class="form-control"
                        placeholder="Ej. Juan"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        class="form-control"
                        placeholder="Ej. Pérez"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    class="form-control"
                    placeholder="usuario@ejemplo.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <div class="input-container with-icon">
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        class="form-control"
                        placeholder="••••••••••••"
                        required
                        autocomplete="new-password"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="direccion_envio">Dirección de Envío</label>
                <input
                    type="text"
                    id="direccion_envio"
                    name="direccion_envio"
                    class="form-control"
                    placeholder="Ej. Av. Providencia 1234, Depto 501"
                    required
                >
            </div>

            <button type="submit" class="btn-submit">
                Crear Cuenta
            </button>

            <div class="footer-text">
                ¿Ya tienes una cuenta?
            </div>

            <a href="{{ url_for('login') }}" class="login-link">Iniciar Sesión</a>
        </form>
    </div>
</body>
</html>
