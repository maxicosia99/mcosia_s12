<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Libro - mcosia_s12</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #f1f3f6;
            min-height: 100vh;
            padding: 2.5rem 1rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 2.5rem;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .btn-back {
            color: #475569;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            background: #f1f5f9;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .alert-container {
            margin-bottom: 1.25rem;
        }

        .alert {
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .alert-danger {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.45rem;
            color: #334155;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.75rem;
        }

        .btn-submit {
            flex: 1;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .btn-cancel {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 1.25rem;
            border-radius: 8px;
            background: #f1f5f9;
            color: #475569;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .btn-cancel:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Editar Libro #{{ libro.id_libro }}</h1>
            <a href="{{ url_for('index') }}" class="btn-back">← Volver al Panel</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="alert-container">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('editar_libro', id_libro=libro.id_libro) }}" method="POST">
            <div class="form-group">
                <label for="titulo">Título del Libro</label>
                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    class="form-control"
                    value="{{ libro.titulo }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="autor">Autor</label>
                <input
                    type="text"
                    id="autor"
                    name="autor"
                    class="form-control"
                    value="{{ libro.autor }}"
                    required
                >
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="precio">Precio ($)</label>
                    <input
                        type="number"
                        id="precio"
                        name="precio"
                        class="form-control"
                        step="0.01"
                        min="0.01"
                        value="{{ libro.precio }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="stock">Stock Disponible</label>
                    <input
                        type="number"
                        id="stock"
                        name="stock"
                        class="form-control"
                        min="0"
                        step="1"
                        value="{{ libro.stock }}"
                        required
                    >
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn-submit">
                    Guardar Cambios
                </button>
                <a href="{{ url_for('index') }}" class="btn-cancel">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</body>
</html>
